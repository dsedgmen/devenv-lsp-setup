name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-rc.*"
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-rc.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build RPMs but skip creating GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build release RPMs
    runs-on: ubuntu-24.04
    container: fedora:latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release: ${{ steps.meta.outputs.release }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - name: Install tools
        run: dnf install -y git rpm-build rpmdevtools

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve, build, stage
        id: meta
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x ./scripts/rpm-version.sh
          eval "$(./scripts/rpm-version.sh --shell)"
          case "$CHANNEL" in stable|rc) ;; *)
            echo "Tag/ref must resolve to stable or rc (got $CHANNEL)" >&2
            exit 1
          ;; esac
          {
            echo "version=$VERSION"
            echo "release=$RELEASE"
            echo "channel=$CHANNEL"
          } >> "$GITHUB_OUTPUT"

          mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/SPECS dist
          mkdir -p "/tmp/pack/devenv-lsp-setup-${VERSION}"
          cp -a lsp-config.lua treesitter-config.lua plugins-config.lua \
            vim-ale-config.vim README.md LICENSE \
            "/tmp/pack/devenv-lsp-setup-${VERSION}/"
          tar -C /tmp/pack -czf ~/rpmbuild/SOURCES/devenv-lsp-setup-${VERSION}.tar.gz \
            "devenv-lsp-setup-${VERSION}"

          qmark='?'
          dist_suffix="%{${qmark}dist}"
          sed \
            -e "s/^Version:.*/Version:        ${VERSION}/" \
            -e "s/^Release:.*/Release:        ${RELEASE}${dist_suffix}/" \
            devenv-lsp-setup.spec > ~/rpmbuild/SPECS/devenv-lsp-setup.spec

          rpmbuild -ba ~/rpmbuild/SPECS/devenv-lsp-setup.spec
          cp -a ~/rpmbuild/RPMS/*/*.rpm ~/rpmbuild/SRPMS/*.rpm dist/

      - name: Upload dist
        uses: actions/upload-artifact@v5
        with:
          name: release-rpms
          path: dist/*

  github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-rpms
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: devenv-lsp-setup ${{ needs.build.outputs.version }}
          prerelease: ${{ needs.build.outputs.channel != 'stable' }}
          body: |
            Channel: **${{ needs.build.outputs.channel }}**

            RPMs: `devenv-lsp-setup`, `devenv-lsp-setup-neovim`, `devenv-lsp-setup-vim`
            EVR: `${{ needs.build.outputs.version }}-${{ needs.build.outputs.release }}`

            See [RELEASE.md](./RELEASE.md).
          files: dist/*
