name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: find . -name '*.sh' -print0 | xargs -0 -r shellcheck

  syntax:
    name: Script and Lua syntax
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install tools
        run: dnf install -y git lua neovim
      - uses: actions/checkout@v5
      - name: bash -n + luac + nvim load
        run: |
          set -euo pipefail
          find . -name '*.sh' -print0 | xargs -0 -r bash -n
          luac -p lsp-config.lua treesitter-config.lua plugins-config.lua
          nvim --headless -u NONE \
            -c 'set rtp+=.' \
            -c 'luafile lsp-config.lua' \
            -c 'luafile treesitter-config.lua' \
            -c 'qa'
