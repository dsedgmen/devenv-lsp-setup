# Packit → Fedora COPR (main=beta; tags=stable/rc)
specfile_path: devenv-lsp-setup.spec

files_to_sync:
  - devenv-lsp-setup.spec
  - .packit.yaml
  - VERSION
  - scripts/rpm-version.sh

upstream_package_name: devenv-lsp-setup
downstream_package_name: devenv-lsp-setup

actions:
  get-current-version:
    - bash -c 'chmod +x ./scripts/rpm-version.sh; ./scripts/rpm-version.sh --shell | sed -n "s/^VERSION=//p" | tr -d "'\''"'

jobs:
  - job: copr_build
    trigger: commit
    branch: main
    targets:
      - fedora-rawhide-x86_64
      - fedora-44-x86_64
      - fedora-43-x86_64

  - job: copr_build
    trigger: commit
    branch: release/.+
    targets:
      - fedora-rawhide-x86_64
      - fedora-44-x86_64
      - fedora-43-x86_64

  - job: copr_build
    trigger: pull_request
    targets:
      - fedora-rawhide-x86_64
      - fedora-44-x86_64
      - fedora-43-x86_64

  - job: copr_build
    trigger: release
    targets:
      - fedora-rawhide-x86_64
      - fedora-44-x86_64
      - fedora-43-x86_64

  - job: propose_downstream
    trigger: release
    dist_git_branches:
      - fedora-rawhide
      - fedora-44
      - fedora-43
